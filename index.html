<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KOKO Corn - Digital menu for delicious corn dishes and winter specialties">
    <title>KOKO Corn | Digital Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 for professional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* ── Brand Colors from Menu Images ── */
            --corn-gold: #FFC72C;
            --corn-gold-dark: #E6AF10;
            --corn-gold-deep: #CC9900;
            --corn-gold-glow: rgba(255, 199, 44, 0.25);
            --corn-gold-glow-strong: rgba(255, 199, 44, 0.45);

            --dark-bg: #0D0D0D;
            --dark-surface: #161616;
            --dark-card: #1A1A1A;
            --dark-card-hover: #222222;
            --dark-elevated: #252525;

            --warm-white: #FFF8E7;
            --cream-text: #F5E6C8;
            --text-primary: #FFFFFF;
            --text-secondary: #B0A89A;
            --text-muted: #7A7268;

            --paprika-red: #E53935;
            --paprika-glow: rgba(229, 57, 53, 0.3);

            --fresh-green: #4CAF50;
            --green-glow: rgba(76, 175, 80, 0.3);
            --whatsapp-green: #25D366;

            /* ── Gradients ── */
            --gradient-gold: linear-gradient(135deg, #FFC72C 0%, #E6AF10 50%, #CC9900 100%);
            --gradient-gold-soft: linear-gradient(135deg, rgba(255, 199, 44, 0.15), rgba(230, 175, 16, 0.05));
            --gradient-dark: linear-gradient(180deg, #0D0D0D 0%, #111111 50%, #0A0A0A 100%);
            --gradient-card: linear-gradient(145deg, #1E1E1E 0%, #181818 100%);
            --gradient-green: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            --gradient-whatsapp: linear-gradient(135deg, #25D366 0%, #128C7E 100%);

            /* ── Effects ── */
            --shadow-gold: 0 4px 20px rgba(255, 199, 44, 0.25);
            --shadow-gold-strong: 0 8px 32px rgba(255, 199, 44, 0.35);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-card-hover: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 199, 44, 0.1);
            --shadow-elevated: 0 20px 60px rgba(0, 0, 0, 0.6);

            --glass-bg: rgba(26, 26, 26, 0.85);
            --glass-border: rgba(255, 199, 44, 0.12);

            --radius-pill: 50px;
            --radius-card: 20px;
            --radius-lg: 24px;
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--gradient-dark);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ─── Ambient Background Particles ─── */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.08;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .ambient-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: var(--corn-gold);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .ambient-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: var(--corn-gold-dark);
            bottom: 20%;
            left: -80px;
            animation-delay: 5s;
            animation-duration: 25s;
        }

        .ambient-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: var(--paprika-red);
            top: 40%;
            right: 10%;
            animation-delay: 10s;
            animation-duration: 22s;
            opacity: 0.04;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(15px, 30px) scale(1.05); }
        }

        /* ─── Floating Ingredients ─── */
        .floating-ingredients {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-item {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0;
            animation: floatUp 18s ease-in-out infinite;
            color: var(--corn-gold);
            pointer-events: none;
        }

        .floating-item:nth-child(1) { left: 5%; animation-delay: 0s; animation-duration: 20s; }
        .floating-item:nth-child(2) { left: 15%; animation-delay: 3s; animation-duration: 22s; }
        .floating-item:nth-child(3) { left: 25%; animation-delay: 6s; animation-duration: 18s; color: var(--corn-gold-dark); }
        .floating-item:nth-child(4) { left: 40%; animation-delay: 1.5s; animation-duration: 24s; }
        .floating-item:nth-child(5) { left: 55%; animation-delay: 4s; animation-duration: 19s; color: var(--corn-gold-deep); }
        .floating-item:nth-child(6) { left: 65%; animation-delay: 7s; animation-duration: 21s; }
        .floating-item:nth-child(7) { left: 75%; animation-delay: 2s; animation-duration: 23s; color: var(--corn-gold-dark); }
        .floating-item:nth-child(8) { left: 88%; animation-delay: 5s; animation-duration: 17s; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            8% { opacity: 0.12; }
            92% { opacity: 0.12; }
            100% { transform: translateY(-80px) rotate(360deg); opacity: 0; }
        }

        /* ─── Header ─── */
        .header {
            position: sticky;
            top: 0;
            background: rgba(13, 13, 13, 0.92);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid var(--corn-gold);
            box-shadow: var(--shadow-gold);
            transition: var(--transition-smooth);
        }

        .logo:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-gold-strong);
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 900;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .cart-btn {
            position: relative;
            background: var(--gradient-gold);
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark-bg);
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-gold);
        }

        .cart-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: var(--shadow-gold-strong);
        }

        .cart-btn:active {
            transform: scale(1.02);
        }

        .cart-count {
            background: var(--paprika-red);
            color: white;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 0.82rem;
            min-width: 24px;
            text-align: center;
            font-weight: 800;
            box-shadow: 0 2px 8px var(--paprika-glow);
        }

        /* ─── Category Tabs ─── */
        .category-tabs {
            position: sticky;
            top: 72px;
            z-index: 99;
            background: rgba(13, 13, 13, 0.88);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            padding: 12px 0;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            border-bottom: 1px solid rgba(255, 199, 44, 0.08);
        }

        .category-tabs::-webkit-scrollbar { display: none; }

        .category-tabs-inner {
            display: inline-flex;
            gap: 8px;
            padding: 0 16px;
        }

        .category-tab {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: var(--dark-card);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .category-tab i { font-size: 0.92rem; }

        .category-tab:hover {
            border-color: var(--corn-gold);
            color: var(--corn-gold);
            background: rgba(255, 199, 44, 0.08);
            transform: translateY(-1px);
        }

        .category-tab.active {
            background: var(--gradient-gold);
            color: var(--dark-bg);
            border-color: transparent;
            box-shadow: var(--shadow-gold);
            font-weight: 800;
        }

        /* ─── Hero Section ─── */
        .hero {
            position: relative;
            padding: 48px 20px 40px;
            text-align: center;
            z-index: 1;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -60%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--corn-gold-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .hero-logo {
            position: relative;
            z-index: 1;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--corn-gold);
            box-shadow: 0 0 40px var(--corn-gold-glow-strong), 0 0 80px rgba(255, 199, 44, 0.15);
            margin-bottom: 22px;
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                transform: translateY(0);
                box-shadow: 0 0 40px var(--corn-gold-glow-strong), 0 0 80px rgba(255, 199, 44, 0.15);
            }
            50% {
                transform: translateY(-8px);
                box-shadow: 0 0 50px var(--corn-gold-glow-strong), 0 0 100px rgba(255, 199, 44, 0.2);
            }
        }

        .welcome-text {
            position: relative;
            z-index: 1;
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .welcome-text span {
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-tagline {
            position: relative;
            z-index: 1;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .hero-info-pills {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 0.9rem;
            border: 1.5px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            transition: var(--transition-smooth);
        }

        .info-pill i { color: var(--corn-gold); }

        .info-pill.delivery {
            background: var(--gradient-green);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 16px var(--green-glow);
            animation: pulse 2.5s ease-in-out infinite;
        }

        .info-pill.rate {
            color: var(--corn-gold);
            font-size: 0.82rem;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* ─── Menu Section ─── */
        .menu-section {
            position: relative;
            padding: 30px 20px 40px;
            z-index: 1;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 28px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .section-title i { color: var(--corn-gold); }

        /* ─── Category Headers ─── */
        .category-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 40px 0 20px;
            padding: 0 5px;
            max-width: 950px;
            margin-left: auto;
            margin-right: auto;
            scroll-margin-top: 150px;
        }

        .category-header:first-child { margin-top: 0; }

        .category-header-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--dark-bg);
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .category-header-text { flex: 1; }

        .category-header-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .category-header-count {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .category-header-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 199, 44, 0.3), transparent);
            border-radius: 2px;
            min-width: 30px;
        }

        /* ─── Menu Grid ─── */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            max-width: 950px;
            margin: 0 auto 10px;
        }

        /* ─── Menu Cards ─── */
        .menu-card {
            background: var(--gradient-card);
            border-radius: var(--radius-card);
            padding: 24px 16px 22px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-gold);
            opacity: 0;
            transition: opacity 0.3s ease, height 0.3s ease;
        }

        .menu-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: var(--shadow-card-hover);
            border-color: rgba(255, 199, 44, 0.15);
            background: var(--dark-card-hover);
        }

        .menu-card:hover::before {
            opacity: 1;
            height: 4px;
        }

        .menu-card:active {
            transform: translateY(-2px) scale(1.01);
        }

        .menu-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.35;
        }

        .menu-description {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .menu-price {
            background: var(--gradient-gold);
            color: var(--dark-bg);
            padding: 6px 16px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.88rem;
            display: inline-block;
            box-shadow: 0 3px 12px rgba(255, 199, 44, 0.3);
        }

        /* Special cards */
        .menu-card.special {
            background: linear-gradient(145deg, rgba(255, 199, 44, 0.08), rgba(26, 26, 26, 1));
            border: 1.5px solid rgba(255, 199, 44, 0.2);
            box-shadow: var(--shadow-card), 0 0 20px rgba(255, 199, 44, 0.06);
        }

        .menu-card.special::before {
            opacity: 1;
            background: var(--gradient-gold);
            height: 3px;
        }

        .special-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--paprika-red);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.62rem;
            font-weight: 700;
            z-index: 5;
            box-shadow: 0 2px 8px var(--paprika-glow);
        }

        .menu-card.special .menu-name { margin-top: 8px; }

        /* ─── Cart Modal ─── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: flex-end;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--dark-surface);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--glass-border);
            border-bottom: none;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--dark-surface);
            z-index: 10;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-title i { color: var(--corn-gold); }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 5px;
            transition: color 0.3s;
            line-height: 1;
        }

        .close-btn:hover { color: var(--paprika-red); }

        .modal-body { padding: 20px; }

        /* ─── Cart Items ─── */
        .cart-items { margin-bottom: 20px; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--dark-card);
            border-radius: 16px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .cart-item-info { flex: 1; }

        .cart-item-name {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .cart-item-price {
            color: var(--corn-gold);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .cart-item-addons {
            font-size: 0.78rem;
            color: var(--fresh-green);
            margin-bottom: 3px;
        }

        .cart-item-remove {
            background: rgba(229, 57, 53, 0.15);
            color: var(--paprika-red);
            border: 1px solid rgba(229, 57, 53, 0.2);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }

        .cart-item-remove:hover {
            background: var(--paprika-red);
            color: white;
        }

        .cart-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .cart-empty-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        /* ─── Cart Total ─── */
        .cart-total {
            background: var(--gradient-gold-soft);
            border: 1px solid var(--glass-border);
            padding: 18px 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .cart-total-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .cart-total-amount {
            font-size: 1.7rem;
            font-weight: 900;
            color: var(--corn-gold);
        }

        /* ─── Cart Actions ─── */
        .cart-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }

        .btn-clear {
            background: var(--dark-card);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-clear:hover {
            background: var(--dark-elevated);
            color: var(--text-primary);
        }

        .btn-whatsapp {
            background: var(--gradient-whatsapp);
            color: white;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
        }

        .btn-whatsapp:hover {
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.45);
        }

            { id: 401, name: "3-Piece Crispy Meal", price: 650000, category: "crispy-meals", description: "3 crispy chicken strips served with French fries", addonType: "none" },
            { id: 402, name: "5-Piece Crispy Meal + Pepsi", price: 1000000, category: "crispy-meals", description: "5 crispy chicken strips, fries and Pepsi", addonType: "none" },
            { id: 403, name: "10-Piece Crispy Meal + 2 Pepsi", price: 2000000, category: "crispy-meals", description: "10 crispy chicken strips, fries and two Pepsi", addonType: "none" },

            // ─── SIDES & SNACKS (Image 2 - LBP prices) ───
            { id: 501, name: "Fava Beans", price: 200000, category: "sides", description: "Traditional seasoned fava beans", addonType: "standard" },
            { id: 502, name: "Lupin Beans", price: 200000, category: "sides", description: "Fresh marinated lupin beans", addonType: "none" },
            { id: 503, name: "Carrots", price: 200000, category: "sides", description: "Fresh crunchy carrots", addonType: "none" },
            { id: 504, name: "Beetroot", price: 200000, category: "sides", description: "Fresh sliced beetroot", addonType: "none" },
            { id: 505, name: "Sweet Potato", price: 200000, category: "sides", description: "Roasted sweet potato", addonType: "sweetpotato" },
            { id: 506, name: "Chestnuts", price: 200000, category: "sides", description: "Roasted chestnuts", addonType: "none" },
            { id: 507, name: "Pomegranate Seeds", price: 300000, category: "sides", description: "Fresh pomegranate seeds", addonType: "none" },

            // ─── COMBO PLATTERS (Image 2 - LBP prices) ───
            { id: 601, name: "Mix Plate", price: 500000, category: "combos", description: "Fava beans + Lupin beans + Corn", special: true, addonType: "standard" },
            { id: 602, name: "Family Mix Plate", price: 900000, category: "combos", description: "A large platter perfect for sharing", special: true, addonType: "standard" },
            { id: 603, name: "Winter Mix Plate", price: 10, currency: "USD", category: "combos", description: "Sweet potato + Chestnuts + Beetroot + Corn", special: true, addonType: "standard" }
        ];

        // ==========================================
        // STATE
        // ==========================================
        let cart = [];
        const USD_RATE = 90000; // 1 USD = 90,000 LBP

        // ==========================================
        // PRICE HELPERS
        // ==========================================
        function formatPrice(price, currency = "LBP") {
            if (currency === "USD") {
                return `$${price.toFixed(2)} (${(price * USD_RATE).toLocaleString('en-US')} LBP)`;
            }
            return `${price.toLocaleString('en-US')} LBP`;
        }

        function toLBP(price, currency = "LBP") {
            if (currency === "USD") {
                return price * USD_RATE;
            }
            return price;
        }

        // ==========================================
        // RENDER CATEGORY TABS
        // ==========================================
        function renderCategoryTabs() {
            const tabsInner = document.getElementById('categoryTabsInner');
            tabsInner.innerHTML = categories.map((cat, index) => `
                <button class="category-tab ${index === 0 ? 'active' : ''}" data-category="${cat.id}" onclick="scrollToCategory('${cat.id}')">
                    <i class="${cat.icon}"></i>
                    <span>${cat.name}</span>
                </button>
            `).join('');
        }

        // ==========================================
        // RENDER MENU — GROUPED BY CATEGORY
        // ==========================================
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            let html = '';

            categories.forEach(cat => {
                const items = menuItems.filter(item => item.category === cat.id);
                if (items.length === 0) return;

                // Category header
                html += `
                    <div class="category-header" id="cat-${cat.id}">
                        <div class="category-header-icon" style="background: ${cat.gradient}">
                            <i class="${cat.icon}"></i>
                        </div>
                        <div class="category-header-text">
                            <div class="category-header-name">${cat.name}</div>
                            <div class="category-header-count">${items.length} items</div>
                        </div>
                        <div class="category-header-line"></div>
                    </div>
                `;

                // Items grid
                html += `<div class="menu-grid">`;
                items.forEach(item => {
                    const isSpecial = item.special || false;
                    html += `
                        <div class="menu-card ${isSpecial ? 'special' : ''}" onclick="openCustomize(${item.id})">
                            ${isSpecial ? '<span class="special-badge">Special</span>' : ''}
                            <div class="menu-name">${item.name}</div>
                            ${item.description ? `<div class="menu-description">${item.description}</div>` : ''}
                            <span class="menu-price">${formatPrice(item.price, item.currency)}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // SCROLL TO CATEGORY
        // ==========================================
        function scrollToCategory(catId) {
            const el = document.getElementById(`cat-${catId}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            setActiveTab(catId);
        }

        function setActiveTab(catId) {
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.category === catId);
            });
            const activeTab = document.querySelector(`.category-tab[data-category="${catId}"]`);
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // ==========================================
        // SCROLL SPY — highlight active category tab
        // ==========================================
        function setupScrollSpy() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const catId = entry.target.id.replace('cat-', '');
                        setActiveTab(catId);
                    }
                });
            }, {
                rootMargin: '-150px 0px -60% 0px',
                threshold: 0
            });

            categories.forEach(cat => {
                const el = document.getElementById(`cat-${cat.id}`);
                if (el) observer.observe(el);
            });
        }

        // ==========================================
        // CUSTOMIZATION / ADD TO CART LOGIC
        // ==========================================
        let currentItem = null;

        function openCustomize(itemId) {
            currentItem = menuItems.find(i => i.id === itemId);
            if (!currentItem) return;

            const addons = addonTypes[currentItem.addonType] || [];

            // If no add-ons, add directly to cart
            if (addons.length === 0) {
                addDirectToCart(currentItem);
                return;
            }

            // Render dynamic add-ons
            const addonsList = document.getElementById('addonsList');
            addonsList.innerHTML = addons.map(addon => {
                const addonPriceLBP = addon.currency === 'USD' ? addon.price * USD_RATE : addon.price;
                const addonDisplay = addon.currency === 'USD'
                    ? `$${addon.price.toFixed(2)} (${addonPriceLBP.toLocaleString('en-US')} LBP)`
                    : `${addon.price.toLocaleString('en-US')} LBP`;
                return `
                    <label class="addon-option">
                        <input type="checkbox" class="addon-checkbox-input" data-id="${addon.id}" data-price="${addonPriceLBP}" data-name="${addon.name}" onchange="updateCustomizeTotal()">
                        <span class="addon-checkbox"></span>
                        <span class="addon-name">${addon.name}</span>
                        <span class="addon-price">${addonDisplay}</span>
                    </label>
                `;
            }).join('');

            // Set item info
            document.getElementById('customizeItemName').textContent = currentItem.name;
            document.getElementById('customizeItemPrice').textContent = formatPrice(currentItem.price, currentItem.currency);

            // Update total
            updateCustomizeTotal();

            // Show modal
            document.getElementById('customizeModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function addDirectToCart(item) {
            const basePriceLBP = item.currency === 'USD' ? item.price * USD_RATE : item.price;

            cart.push({
                ...item,
                addons: [],
                addonsPrice: 0,
                totalPrice: item.price,
                totalPriceLBP: basePriceLBP,
                cartId: Date.now()
            });
            updateCartCount();
            showToast(`${item.name} added to cart ✓`);
        }

        function closeCustomize() {
            document.getElementById('customizeModal').classList.remove('active');
            document.body.style.overflow = '';
            currentItem = null;
        }

        function updateCustomizeTotal() {
            if (!currentItem) return;

            let basePriceLBP = currentItem.currency === 'USD' ? currentItem.price * USD_RATE : currentItem.price;

            const checkboxes = document.querySelectorAll('.addon-checkbox-input:checked');
            let addonsPrice = 0;
            checkboxes.forEach(cb => {
                addonsPrice += parseInt(cb.dataset.price);
            });

            const totalLBP = basePriceLBP + addonsPrice;
            document.getElementById('customizeTotal').textContent = `${totalLBP.toLocaleString('en-US')} LBP`;
        }

        function confirmAddToCart() {
            if (!currentItem) return;

            let addons = [];
            let addonsPrice = 0;

            const checkboxes = document.querySelectorAll('.addon-checkbox-input:checked');
            checkboxes.forEach(cb => {
                addons.push(cb.dataset.name);
                addonsPrice += parseInt(cb.dataset.price);
            });

            const basePriceLBP = currentItem.currency === 'USD' ? currentItem.price * USD_RATE : currentItem.price;
            const totalPriceLBP = basePriceLBP + addonsPrice;

            cart.push({
                ...currentItem,
                addons: addons,
                addonsPrice: addonsPrice,
                totalPrice: currentItem.price + (currentItem.currency === 'USD' ? 0 : addonsPrice),
                totalPriceLBP: totalPriceLBP,
                cartId: Date.now()
            });

            updateCartCount();
            closeCustomize();
            showToast(`${currentItem.name} added to cart ✓`);
        }

        // Close customize modal on overlay click
        document.getElementById('customizeModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeCustomize();
            }
        });

        // ==========================================
        // CART LOGIC
        // ==========================================
        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.length;
        }

        function openCart() {
            renderCartItems();
            document.getElementById('cartModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function renderCartItems() {
            const cartItemsContainer = document.getElementById('cartItems');

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="cart-empty">
                        <div class="cart-empty-icon"><i class="fa-solid fa-cart-shopping"></i></div>
                        <p>Your cart is empty</p>
                    </div>
                `;
                document.getElementById('cartTotal').textContent = '0 LBP';
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        ${item.addons && item.addons.length > 0 ? `<div class="cart-item-addons">+ ${item.addons.join(' + ')}</div>` : ''}
                        <div class="cart-item-price">${item.totalPriceLBP.toLocaleString('en-US')} LBP</div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart(${item.cartId})">Remove</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.totalPriceLBP, 0);
            document.getElementById('cartTotal').textContent = `${total.toLocaleString('en-US')} LBP`;
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartCount();
            renderCartItems();
            showToast('Removed from cart');
        }

        function clearCart() {
            cart = [];
            updateCartCount();
            renderCartItems();
            showToast('Cart cleared');
        }

        // ==========================================
        // WHATSAPP ORDER
        // ==========================================
        function sendToWhatsApp() {
            if (cart.length === 0) {
                showToast('Cart is empty!');
                return;
            }

            const phoneNumber = '96170445366';

            let message = 'Hi, I would like to order the following:\n\n';

            cart.forEach(item => {
                let itemLine = `- ${item.name}`;
                if (item.addons && item.addons.length > 0) {
                    itemLine += ` + ${item.addons.join(' + ')}`;
                }
                itemLine += `: ${item.totalPriceLBP.toLocaleString('en-US')} LBP\n`;
                message += itemLine;
            });

            const total = cart.reduce((sum, item) => sum + item.totalPriceLBP, 0);

            message += '\n';
            message += `Total: ${total.toLocaleString('en-US')} LBP\n`;
            message += '\nThank you! 🌽';

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        // ==========================================
        // TOAST
        // ==========================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Close modal on overlay click
        document.getElementById('cartModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeCart();
            }
        });

        // ==========================================
        // INITIALIZE
        // ==========================================
        renderCategoryTabs();
        renderMenu();
        setupScrollSpy();
    </script>
